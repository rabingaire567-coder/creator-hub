name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          # Convex client URL is only read at runtime, but provide a
          # placeholder so import.meta.env is always defined for the build.
          VITE_CONVEX_URL: https://placeholder.convex.cloud
